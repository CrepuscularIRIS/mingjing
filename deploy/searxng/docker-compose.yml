# MingJing — self-contained SearXNG (Layer 1: self-written, standalone).
#
# A keyless local search aggregator. From a China network, configure it to use
# CN-reachable backends (Bing, Baidu) — see settings.yml. Google is blocked from
# CN, so it's disabled there.
#
# Bring up:
#   cd mingjing/deploy/searxng && docker compose up -d
# Then point MingJing at it (.env):
#   MINGJING_SEARXNG_URL=http://localhost:8080
# Health check:
#   curl -s 'http://localhost:8080/search?q=notion&format=json' | head -c 400
#
# Layer 2 (reuse your existing LDR SearXNG) is documented in
# mingjing/docs/SEARCH.md — no second container needed there.

services:
  searxng:
    image: searxng/searxng:latest
    container_name: mingjing-searxng
    # Host 8080 is commonly taken; MingJing uses 8888 → MINGJING_SEARXNG_URL=http://localhost:8888
    ports:
      - "8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
