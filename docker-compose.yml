# MingJing — full local stack: backend (FastAPI) + frontend (nginx) + SearXNG.
#
# Quickstart (no API key needed — deterministic cache_first demo data):
#   docker compose up --build
#   open http://localhost:5173
#
# For live web + LLM runs: copy .env.example -> .env, set MINIMAX_API_KEY (and a
# search key, or use the bundled SearXNG), then:
#   MINGJING_MODE=live_first docker compose up --build
services:
  backend:
    build: .
    image: mingjing-backend:latest
    container_name: mingjing-backend
    environment:
      MINGJING_MODE: ${MINGJING_MODE:-cache_first}
      MINGJING_SEARXNG_URL: http://searxng:8080
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      BOCHA_API_KEY: ${BOCHA_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - mingjing-data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: mingjing-frontend:latest
    container_name: mingjing-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

  # Keyless local search aggregator (CN-tuned: Bing + Baidu). Optional for
  # cache_first demos; required for live web collection without a paid key.
  searxng:
    image: searxng/searxng:latest
    container_name: mingjing-searxng
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
    ports:
      - "8888:8080"
    restart: unless-stopped

volumes:
  mingjing-data:
